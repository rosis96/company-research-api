# ---------------------------------------------------------------------------
# Third-party domains that must never be followed.  These are already excluded
# by registrable-domain scope enforcement; they are listed explicitly so the
# intent is auditable and so discovery can drop them before scoring.
# ---------------------------------------------------------------------------
