# URL exclusion rules and subdomain tiers.
#
# Architecture reference: SS6 ("Hard exclusions", "Subdomain policy") and SS7.
# Everything here is data, never code.

version: 1

# ---------------------------------------------------------------------------
# Schemes that are dropped during link discovery.  (The URL guard independently
# refuses anything that is not http/https; this list stops such links from even
# entering the candidate pool.)
# ---------------------------------------------------------------------------
blocked_schemes:
  - mailto
  - tel
  - sms
  - javascript
  - data
  - ftp
  - file
  - callto
  - skype
  - whatsapp

# ---------------------------------------------------------------------------
# Path segments that disqualify a URL outright.  Matched against individual
# lowercased path segments unless listed under `path_substrings`.
# ---------------------------------------------------------------------------
blocked_path_segments:
  # authentication / account
  - login
  - log-in
  - signin
  - sign-in
  - signup
  - sign-up
  - register
  - registration
  - password
  - reset-password
  - forgot-password
  - logout
  - account
  - my-account
  - myaccount
  - profile
  - dashboard
  - admin
  - administrator
  - portal
  # commerce
  - cart
  - basket
  - checkout
  - order
  - orders
  - payment
  - billing
  - invoice
  # legal / policy
  - privacy
  - privacy-policy
  - terms
  - terms-of-service
  - terms-and-conditions
  - tos
  - legal
  - disclaimer
  - imprint
  - impressum
  - cookie
  - cookies
  - cookie-policy
  - gdpr
  - ccpa
  - dsar
  - accessibility
  - modern-slavery
  # site plumbing
  - search
  - feed
  - rss
  - atom
  - sitemap
  - wp-admin
  - wp-json
  - wp-content
  - wp-includes
  - xmlrpc
  - cdn-cgi
  - tag
  - tags
  - category
  - categories
  - author
  - archive
  - archives
  - page
  - amp
  # careers detail pages (the overview page is allowed -- see SS7)
  - jobs
  - job
  - positions
  - position
  - openings
  - opening
  - vacancies
  - vacancy
  - apply
  - application
  - job-application

path_substrings:
  - /wp-admin/
  - /wp-json/
  - /cdn-cgi/
  - /.well-known/
  - /feed/
  - /amp/

# Careers overview paths are allowed at low weight, but only as a single path
# segment: /careers is allowed, /careers/senior-engineer is not (SS7).
careers_overview_segments:
  - careers
  - career
  - culture
  - our-culture
  - join-us
  - join-our-team
  - work-with-us
  - why-work-here
careers_overview_prefixes:
  - life-at
  - working-at
  - life-at-
  - working-at-

