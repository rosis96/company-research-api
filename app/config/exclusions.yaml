  - medium.com
  - github.com
  - vimeo.com
  # directories / review sites / data vendors
  - crunchbase.com
  - g2.com
  - capterra.com
  - trustpilot.com
  - glassdoor.com
  - indeed.com
  - clutch.co
  - yelp.com
  - bbb.org
  - owler.com
  - zoominfo.com
  - apollo.io
  # applicant tracking systems
  - greenhouse.io
  - lever.co
  - workable.com
  - bamboohr.com
  - ashbyhq.com
  - smartrecruiters.com
  - myworkdayjobs.com
  - workday.com
  - icims.com
  - jobvite.com
  - recruitee.com
  - teamtailor.com
  - personio.de
  - breezy.hr
  - rippling.com
  - jazzhr.com
  # scheduling / misc embeds
  - calendly.com
  - hubspot.com
  - eventbrite.com
  - typeform.com

